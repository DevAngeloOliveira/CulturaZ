spring:
  application:
    name: culturaz-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/culturaz}
    username: ${DATABASE_USERNAME:culturaz}
    password: ${DATABASE_PASSWORD:culturaz}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${API_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

culturaz:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-please-replace-with-a-random-256-bit-key-in-production-environments}
      access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
      refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
      issuer: culturaz-api

logging:
  level:
    root: INFO
    com.culturaz: DEBUG
    org.flywaydb: INFO

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    org.hibernate.SQL: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
culturaz:
  security:
    jwt:
      secret: test-only-secret-must-be-long-enough-to-satisfy-hmac-sha256-key-requirement-padding-padding

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    properties:
      hibernate:
        format_sql: false
logging:
  level:
    com.culturaz: INFO
