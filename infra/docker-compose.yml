name: culturaz

services:
  postgres:
    image: postgres:16-alpine
    container_name: culturaz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: culturaz
      POSTGRES_USER: culturaz
      POSTGRES_PASSWORD: culturaz
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U culturaz -d culturaz"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: culturaz-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["full"]
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: culturaz-api:local
    container_name: culturaz-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/culturaz
      DATABASE_USERNAME: culturaz
      DATABASE_PASSWORD: culturaz
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-replace-with-a-random-256-bit-key-in-production-environments}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: 3600
      JWT_REFRESH_TOKEN_EXPIRATION_SECONDS: 2592000
      API_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
    name: culturaz_postgres_data
