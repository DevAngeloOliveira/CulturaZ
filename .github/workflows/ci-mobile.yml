name: CI · Mobile

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/ci-mobile.yml'

jobs:
  typecheck:
    name: Typecheck & lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm --filter mobile typecheck

      - name: Lint
        continue-on-error: true
        run: pnpm --filter mobile lint
